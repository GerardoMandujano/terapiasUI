<div class="login-container">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Iniciar sesión</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <form (ngSubmit)="onLogin()">
          <mat-form-field appearance="fill">
            <mat-label>Nombre de usuario</mat-label>
            <input matInput type="text" placeholder="Introduce tu nombre de usuario" [(ngModel)]="username" name="username" required>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>Contraseña</mat-label>
            <input matInput type="password" placeholder="Introduce tu contraseña" [(ngModel)]="password" name="password" required>
          </mat-form-field>
          
          <!-- Mostrar mensaje de error si el login falla -->
          <div *ngIf="errorMessage" class="error-message">
            <mat-error>{{ errorMessage }}</mat-error>
          </div>
  
          <button mat-raised-button color="primary" type="submit">Iniciar sesión</button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
