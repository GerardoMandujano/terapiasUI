<div>
  <mat-card>
    <mat-card-content  class="row header">
<div class="col-md-2"><img src="assets/img/luna.png" alt="">      </div>
<div class="col-md-10"><h1>WITCHMOON</h1></div>

 </mat-card-content>

      </mat-card>
</div>

<div class="contenido row">

  <div class="col-md-9">
  
    
    <div class="login-container">
      
      <mat-card class="login-card">
        <mat-card>
          <mat-card-content>
            <span class="titulo">Iniciar Sesion</span>
          </mat-card-content>
        </mat-card>
        <mat-card-header>
        </mat-card-header>
        <mat-card-content>
          <form class="login-form" (ngSubmit)="onLogin()">
            <mat-form-field class="input-field" appearance="fill">
              <mat-label>Nombre de usuario</mat-label>
              <input matInput type="text" placeholder="Introduce tu nombre de usuario"
                     [(ngModel)]="username" name="username" required>
            </mat-form-field>
            <br>
            <mat-form-field class="input-field" appearance="fill">
              <mat-label>Contraseña</mat-label>
              <input class="formulario-input" matInput type="password"
                     placeholder="Introduce tu contraseña"
                     [(ngModel)]="password" name="password" required>
            </mat-form-field>
            <br>
            <div *ngIf="errorMessage" class="error-message">
              <mat-error>{{ errorMessage }}</mat-error>
            </div>
            <br>
            <p>¿Olvidaste la contraseña?</p>
            <button mat-raised-button color="primary" type="submit">Iniciar sesión</button>
          </form>
          
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
